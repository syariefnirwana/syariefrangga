<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Syarief Rangga</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: clamp(20px, 5vw, 50px);

      background: #f4f4f4;
      color: #111;

      font-family: "Comic Neue", sans-serif;

      /* Tekstur titik ala kartun jadul */
      background-image:
        radial-gradient(#111 0.6px, transparent 0.6px);
      background-size: 7px 7px;

      overflow-x: hidden;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 700px;

      margin: auto;
    }

    /* =========================
       MAIN CARD
    ========================= */

    .main {
      width: 100%;

      background: #fff;

      border: clamp(3px, 0.6vw, 5px) solid #111;
      border-radius: clamp(12px, 3vw, 18px);

      padding: clamp(35px, 8vw, 60px)
               clamp(20px, 6vw, 50px);

      text-align: center;

      box-shadow:
        clamp(5px, 1.5vw, 10px)
        clamp(5px, 1.5vw, 10px)
        0 #111;

      transform: rotate(-1deg);
    }

    /* =========================
       HI
    ========================= */

    .main h1 {
      font-family: "Bangers", cursive;

      font-size: clamp(70px, 18vw, 130px);

      line-height: 0.9;

      letter-spacing: clamp(2px, 1vw, 6px);

      margin-bottom: clamp(20px, 5vw, 30px);

      /* Efek tulisan komik */
      text-shadow:
        3px 3px 0 #fff,
        6px 6px 0 #111;
    }

    /* =========================
       NAME
    ========================= */

    .main h3 {
      display: inline-block;

      max-width: 100%;

      padding: 10px 18px;

      background: #eee;

      border: 3px solid #111;
      border-radius: 10px;

      font-size: clamp(17px, 4vw, 24px);

      line-height: 1.3;

      font-weight: 700;

      transform: rotate(1deg);
    }

    /* =========================
       CONTACT
    ========================= */

    .contact {
      margin-top: clamp(30px, 7vw, 45px);

      width: 100%;

      background: #111;
      color: #fff;

      border: 4px solid #111;
      border-radius: 15px;

      box-shadow:
        clamp(4px, 1vw, 7px)
        clamp(4px, 1vw, 7px)
        0 #fff;

      transform: rotate(1deg);

      overflow: hidden;
    }

    /* Gmail menjadi link yang bisa ditap */

    .contact a {
      display: block;

      width: 100%;

      padding: clamp(18px, 5vw, 25px);

      color: #fff;

      text-decoration: none;

      font-size: clamp(15px, 4vw, 19px);

      font-weight: 700;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    /* Hover desktop */

    .contact a:hover {
      background: #fff;
      color: #111;
    }

    /* Tap / klik */

    .contact a:active {
      transform: scale(0.97);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 20px 15px;
      }

      .main {
        padding: 40px 18px;
      }

      .main h3 {
        width: 100%;
      }

      .contact {
        margin-top: 30px;
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (min-width: 481px) and (max-width: 900px) {

      .container {
        max-width: 650px;
      }
    }

    /* =========================
       REDUCE MOTION
       Untuk pengguna yang
       mematikan animasi perangkat
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      .contact a {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- INTRO -->

    <section class="main">

      <h1>Hi!</h1>

      <h3>
        Saya, Syarief Rangga Nirwana
      </h3>

    </section>


    <!-- CONTACT -->

    <section class="contact">

      <a
        href="mailto:syariefnirwana35@gmail.com"
        aria-label="Kirim email ke Syarief Rangga"
      >
        ✉ Gmail : syariefnirwana35@gmail.com
      </a>

    </section>

  </main>

</body>
</html>
