<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Syarief Rangga</title>

  <style>
    /* =====================================================
       RESET & VIEWPORT
    ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      background: #f4f4f4;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      background-image: radial-gradient(#111 0.6px, transparent 0.6px);
      background-size: 7px 7px;
    }

    /* =====================================================
       MAIN WEBSITE UI
    ===================================================== */
    .website {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end; 
      justify-content: center;
      padding: clamp(20px, 5vw, 50px);
      padding-bottom: 12vh; 
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
      pointer-events: none;
      z-index: 2;
    }

    .website.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .container {
      width: min(700px, calc(100vw - 30px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(25px, 5vw, 40px);
    }

    /* =====================================================
       MAIN CARD
    ===================================================== */
    .main {
      width: 100%;
      background: #fff;
      border: clamp(3px, .6vw, 5px) solid #111;
      border-radius: clamp(12px, 3vw, 18px);
      padding: clamp(30px, 7vw, 60px) clamp(18px, 6vw, 50px);
      text-align: center;
      box-shadow: clamp(5px, 1.5vw, 10px) clamp(5px, 1.5vw, 10px) 0 #111;
      transform: rotate(-1deg);
      position: relative;
      z-index: 2;
    }

    .main h1 {
      font-family: Georgia, serif;
      font-size: clamp(70px, 18vw, 130px);
      line-height: .9;
      margin-bottom: clamp(20px, 5vw, 30px);
      text-shadow: 3px 3px 0 #fff, 6px 6px 0 #111;
    }

    .main h3 {
      display: inline-block;
      max-width: 100%;
      padding: 10px 18px;
      background: #eee;
      border: 3px solid #111;
      border-radius: 10px;
      font-size: clamp(17px, 4vw, 24px);
      line-height: 1.3;
      font-weight: 700;
      transform: rotate(1deg);
    }

    /* =====================================================
       CONTACT
    ===================================================== */
    .contact {
      width: 100%;
      background: #111;
      border: 4px solid #111;
      border-radius: 15px;
      box-shadow: 6px 6px 0 #fff;
      transform: rotate(1deg);
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .contact a {
      display: block;
      width: 100%;
      padding: clamp(18px, 5vw, 25px);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 700;
      transition: background .2s ease, color .2s ease, transform .2s ease;
      pointer-events: auto;
    }

    .contact a:hover {
      background: #fff;
      color: #111;
    }

    .contact a:active {
      transform: scale(.97);
    }

    /* =====================================================
       BOUNCY BALL CANVAS
    ===================================================== */
    #footballCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 10;
      /* Pointer events diatur none agar tombol email tetap bisa diklik. 
         Event interaction bola di-handle via Javascript window */
      pointer-events: none; 
    }

    /* =====================================================
       LOADING & HELLO SCREEN
    ===================================================== */
    .loading-screen, .hello-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      transition: opacity .8s ease, visibility .8s ease;
    }
    
    .loading-screen.hide, .hello-screen.hide { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    
    .skeleton { width: min(700px, 85vw); display: flex; flex-direction: column; align-items: center; gap: 25px; }
    .skeleton-box { position: relative; overflow: hidden; background: #ddd; border-radius: 10px; }
    .skeleton-title { width: 180px; height: 90px; border-radius: 20px; }
    .skeleton-name { width: min(400px, 70vw); height: 45px; }
    .skeleton-contact { width: min(500px, 80vw); height: 65px; }

    .hello-screen { z-index: 9998; opacity: 0; visibility: hidden; pointer-events: none; }
    .hello-screen.show { opacity: 1; visibility: visible; }
    .hello-text { font-size: clamp(60px, 16vw, 150px); font-weight: 400; letter-spacing: -.045em; color: #111; }

    @media (max-width: 600px) {
      .website { padding: 15px; padding-bottom: 5vh; }
      .container { width: min(100%, 500px); }
    }
  </style>
</head>

<body>

  <!-- LOADING SKELETON -->
  <div class="loading-screen" id="loadingScreen">
    <div class="skeleton">
      <div class="skeleton-box skeleton-title"></div>
      <div class="skeleton-box skeleton-name"></div>
      <div class="skeleton-box skeleton-contact"></div>
    </div>
  </div>

  <!-- HELLO TEXT -->
  <div class="hello-screen" id="helloScreen">
    <div class="hello-text" id="helloText"></div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="website" id="website">
    <div class="container">
      <section class="main">
        <h1>Hi!</h1>
        <h3>Saya, Syarief Rangga Nirwana</h3>
      </section>
      <section class="contact">
        <a href="mailto:syariefnirwana35@gmail.com" aria-label="Kirim email ke Syarief Rangga">
          ✉ Gmail : syariefnirwana35@gmail.com
        </a>
      </section>
    </div>
  </main>

  <!-- 2D BOUNCY BALL CANVAS -->
  <canvas id="footballCanvas"></canvas>


  <script>
    // --- UI INTRO LOGIC ---
    const loadingScreen = document.getElementById("loadingScreen");
    const helloScreen = document.getElementById("helloScreen");
    const helloText = document.getElementById("helloText");
    const website = document.getElementById("website");
    
    const helloMessage = "Hello!";
    let helloIndex = 0;

    function typeHello() {
      if (helloIndex < helloMessage.length) {
        helloText.textContent += helloMessage[helloIndex];
        helloIndex++;
        setTimeout(typeHello, 180);
      }
    }

    window.addEventListener("load", () => {
      setTimeout(() => {
        loadingScreen.classList.add("hide");
        setTimeout(() => {
          helloScreen.classList.add("show");
          setTimeout(typeHello, 450);
          setTimeout(() => {
            helloScreen.classList.remove("show");
            helloScreen.classList.add("hide"); // Perbaikan: Menghapus spasi dan !important yang membuat JS error
            setTimeout(() => {
              website.classList.add("show");
              initializeFootball(); // Memanggil game bola pantul original
            }, 700);
          }, 2500);
        }, 700);
      }, 1200);
    });

    // --- 2D BOUNCY BALL PHYSICS & GRAPHICS ---
    function initializeFootball() {
      const canvas = document.getElementById("footballCanvas");
      const ctx = canvas.getContext("2d");

      let width = 0, height = 0, dpr = 1;

      const ball = {
        x: 0, y: 0,
        vx: 1.6, vy: 0.8,
        radius: window.innerWidth < 500 ? 27 : 32,
        rotation: 0, angularVelocity: 0,
        squashX: 1, squashY: 1, targetSquashX: 1, targetSquashY: 1,
        dragging: false, lastX: 0, lastY: 0, lastTime: 0,
        dragVX: 0, dragVY: 0
      };

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        ball.x = Math.max(ball.radius, Math.min(width - ball.radius, ball.x || width / 2));
        ball.y = Math.max(ball.radius, Math.min(height - ball.radius, ball.y || height * 0.55));
      }
      resize();
      window.addEventListener("resize", resize);

      let lastInteraction = performance.now();
      let idleMode = false;
      const IDLE_DELAY = 15000;
      const IDLE_SPEED = 2.0;

      function resetIdleTimer() {
        lastInteraction = performance.now();
        idleMode = false;
      }

      window.addEventListener("pointerdown", (e) => {
        // Abaikan jika user mengklik tombol/link email
        if (e.target.tagName === 'A' || e.target.closest('a')) return;
        
        const dist = Math.hypot(e.clientX - ball.x, e.clientY - ball.y);
        // Area klik diperbesar sedikit
        if (dist > ball.radius * 2) return; 

        resetIdleTimer();
        ball.dragging = true;
        ball.vx = 0; ball.vy = 0;
        ball.dragVX = 0; ball.dragVY = 0;
        ball.lastX = e.clientX; ball.lastY = e.clientY;
        ball.lastTime = performance.now();
      });

      window.addEventListener("pointermove", (e) => {
        if (!ball.dragging) return;
        resetIdleTimer();

        const now = performance.now();
        const dt = Math.max(now - ball.lastTime, 1);
        const dx = e.clientX - ball.lastX;
        const dy = e.clientY - ball.lastY;

        ball.x = Math.max(ball.radius, Math.min(width - ball.radius, e.clientX));
        ball.y = Math.max(ball.radius, Math.min(height - ball.radius, e.clientY));

        ball.dragVX = (dx / dt) * 16;
        ball.dragVY = (dy / dt) * 16;
        ball.angularVelocity = dx * 0.025;
        ball.rotation += dx * 0.025;

        ball.lastX = e.clientX;
        ball.lastY = e.clientY;
        ball.lastTime = now;
      });

      window.addEventListener("pointerup", (e) => {
        if (!ball.dragging) return;
        ball.dragging = false;
        resetIdleTimer();

        ball.vx = ball.dragVX * 1.8;
        ball.vy = ball.dragVY * 1.8;
        
        const maxV = 25;
        ball.vx = Math.max(-maxV, Math.min(maxV, ball.vx));
        ball.vy = Math.max(-maxV, Math.min(maxV, ball.vy));
        ball.angularVelocity = ball.vx * 0.025;
      });

      function drawPolygon(cx, cy, radius, sides, rotation) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const angle = rotation + (i * Math.PI * 2) / sides;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      function drawFootball() {
        ctx.save();
        ctx.translate(ball.x, ball.y);

        // Shadow
        ctx.save();
        ctx.translate(0, ball.radius * 0.82);
        ctx.scale(1.0, 0.22);
        ctx.beginPath();
        ctx.ellipse(0, 0, ball.radius * 0.82, ball.radius * 0.42, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fill();
        ctx.restore();

        // Ball Body
        ctx.rotate(ball.rotation);
        ctx.scale(ball.squashX, ball.squashY);

        const gradient = ctx.createRadialGradient(-ball.radius * 0.35, -ball.radius * 0.42, ball.radius * 0.08, 0, 0, ball.radius);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.68, "#eeeeee");
        gradient.addColorStop(1, "#bcbcbc");

        ctx.beginPath();
        ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#111";
        ctx.stroke();

        // Pentagon
        drawPolygon(0, 0, ball.radius * 0.27, 5, -Math.PI / 2);
        ctx.fillStyle = "#111";
        ctx.fill();

        // Lines
        const angles = [-Math.PI / 2, Math.PI / 10, Math.PI * 0.9, Math.PI * 1.45, Math.PI * 1.85];
        angles.forEach(angle => {
          const px = Math.cos(angle) * ball.radius * 0.64;
          const py = Math.sin(angle) * ball.radius * 0.64;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(px - Math.cos(angle - 0.5) * 7, py - Math.sin(angle - 0.5) * 7);
          ctx.lineTo(px + Math.cos(angle - 0.5) * 7, py + Math.sin(angle - 0.5) * 7);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 1.8;
          ctx.stroke();
        });

        // Highlight
        ctx.beginPath();
        ctx.arc(-ball.radius * 0.32, -ball.radius * 0.38, ball.radius * 0.12, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.fill();
        ctx.restore();
      }

      function hitWall(side, velocity) {
        if (velocity < 0.7) return;
        const strength = Math.min(velocity / 20, 1);
        if (side === "left" || side === "right") {
          ball.targetSquashX = 1 - 0.23 * strength;
          ball.targetSquashY = 1 + 0.14 * strength;
        }
        if (side === "top" || side === "bottom") {
          ball.targetSquashX = 1 + 0.14 * strength;
          ball.targetSquashY = 1 - 0.23 * strength;
        }
        setTimeout(() => { ball.targetSquashX = 1; ball.targetSquashY = 1; }, 70);
      }

      let lastFrame = performance.now();

      function update(currentTime) {
        const dt = Math.min((currentTime - lastFrame) / 16.6667, 2);
        lastFrame = currentTime;

        if (!ball.dragging && !idleMode && currentTime - lastInteraction >= IDLE_DELAY) {
            idleMode = true;
            const speed = Math.hypot(ball.vx, ball.vy);
            if (speed < 0.001) {
                ball.vx = IDLE_SPEED; ball.vy = IDLE_SPEED * 0.35;
            } else {
                ball.vx = (ball.vx / speed) * IDLE_SPEED;
                ball.vy = (ball.vy / speed) * IDLE_SPEED;
            }
        }

        if (!ball.dragging) {
          if (idleMode) {
             const speed = Math.hypot(ball.vx, ball.vy);
             if (speed > 0.001) {
                ball.vx = (ball.vx / speed) * IDLE_SPEED;
                ball.vy = (ball.vy / speed) * IDLE_SPEED;
             }
          }

          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;
          ball.rotation += ball.angularVelocity * dt;
          ball.angularVelocity *= Math.pow(0.985, dt);

          if (!idleMode) {
            ball.vx *= Math.pow(0.996, dt);
            ball.vy *= Math.pow(0.996, dt);
          }

          if (ball.x - ball.radius < 0) {
            ball.x = ball.radius; ball.vx = Math.abs(ball.vx) * 0.82;
            hitWall("left", Math.abs(ball.vx));
          }
          if (ball.x + ball.radius > width) {
            ball.x = width - ball.radius; ball.vx = -Math.abs(ball.vx) * 0.82;
            hitWall("right", Math.abs(ball.vx));
          }
          if (ball.y - ball.radius < 0) {
            ball.y = ball.radius; ball.vy = Math.abs(ball.vy) * 0.82;
            hitWall("top", Math.abs(ball.vy));
          }
          if (ball.y + ball.radius > height) {
            ball.y = height - ball.radius; ball.vy = -Math.abs(ball.vy) * 0.82;
            hitWall("bottom", Math.abs(ball.vy));
          }
        }

        ball.squashX += (ball.targetSquashX - ball.squashX) * 0.22 * dt;
        ball.squashY += (ball.targetSquashY - ball.squashY) * 0.22 * dt;
        ball.targetSquashX = 1;
        ball.targetSquashY = 1;

        ctx.clearRect(0, 0, width, height);
        drawFootball();
        requestAnimationFrame(update);
      }
      requestAnimationFrame(update);
    }
  </script>
</body>
</html>
