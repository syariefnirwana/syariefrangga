<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Syarief Rangga</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;

      -webkit-user-drag: none;
    }


    /* =====================================================
       VIEWPORT
    ===================================================== */

    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      overscroll-behavior: none;
    }


    body {

      position: fixed;

      inset: 0;

      background: #f4f4f4;

      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      touch-action: none;

      background-image:
        radial-gradient(
          #111 0.6px,
          transparent 0.6px
        );

      background-size: 7px 7px;
    }


    /* =====================================================
       MAIN WEBSITE
    ===================================================== */

    .website {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        clamp(20px, 5vw, 50px);

      opacity: 0;

      transform:
        translateY(20px);

      transition:
        opacity 1s ease,
        transform 1s ease;

      pointer-events: none;

      z-index: 2;
    }


    .website.show {

      opacity: 1;

      transform:
        translateY(0);

      pointer-events: auto;
    }


    .container {

      width:
        min(
          700px,
          calc(100vw - 30px)
        );

      display: flex;

      flex-direction: column;

      align-items: center;

      gap:
        clamp(
          25px,
          5vw,
          40px
        );
    }


    /* =====================================================
       MAIN CARD
    ===================================================== */

    .main {

      width: 100%;

      background: #fff;

      border:
        clamp(3px, .6vw, 5px)
        solid #111;

      border-radius:
        clamp(12px, 3vw, 18px);

      padding:
        clamp(30px, 7vw, 60px)
        clamp(18px, 6vw, 50px);

      text-align: center;

      box-shadow:
        clamp(5px, 1.5vw, 10px)
        clamp(5px, 1.5vw, 10px)
        0 #111;

      transform:
        rotate(-1deg);

      position: relative;

      z-index: 2;
    }


    .main h1 {

      font-family:
        Georgia,
        serif;

      font-size:
        clamp(
          70px,
          18vw,
          130px
        );

      line-height: .9;

      margin-bottom:
        clamp(
          20px,
          5vw,
          30px
        );

      text-shadow:
        3px 3px 0 #fff,
        6px 6px 0 #111;
    }


    .main h3 {

      display: inline-block;

      max-width: 100%;

      padding:
        10px 18px;

      background: #eee;

      border:
        3px solid #111;

      border-radius: 10px;

      font-size:
        clamp(
          17px,
          4vw,
          24px
        );

      line-height: 1.3;

      font-weight: 700;

      transform:
        rotate(1deg);
    }


    /* =====================================================
       CONTACT
    ===================================================== */

    .contact {

      width: 100%;

      background: #111;

      border:
        4px solid #111;

      border-radius: 15px;

      box-shadow:
        6px 6px 0 #fff;

      transform:
        rotate(1deg);

      overflow: hidden;

      position: relative;

      z-index: 2;
    }


    .contact a {

      display: block;

      width: 100%;

      padding:
        clamp(
          18px,
          5vw,
          25px
        );

      color: #fff;

      text-decoration: none;

      text-align: center;

      font-size:
        clamp(
          15px,
          4vw,
          19px
        );

      font-weight: 700;

      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;

      pointer-events: auto;
    }


    .contact a:hover {

      background: #fff;

      color: #111;
    }


    .contact a:active {

      transform:
        scale(.97);
    }


    /* =====================================================
       FULLSCREEN FOOTBALL CANVAS
    ===================================================== */

    #footballCanvas {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      display: block;

      z-index: 10;

      pointer-events: auto;

      touch-action: none;

      cursor: default;
    }


    /* =====================================================
       LOADING SCREEN
    ===================================================== */

    .loading-screen {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #f4f4f4;

      transition:
        opacity .8s ease,
        visibility .8s ease;
    }


    .loading-screen.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    /* =====================================================
       SKELETON
    ===================================================== */

    .skeleton {

      width:
        min(
          700px,
          85vw
        );

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 25px;
    }


    .skeleton-box {

      position: relative;

      overflow: hidden;

      background: #ddd;

      border-radius: 10px;
    }


    .skeleton-box::after {

      content: "";

      position: absolute;

      top: 0;
      left: -150%;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.7),
          transparent
        );

      animation:
        skeleton-loading 1.4s infinite;
    }


    .skeleton-title {

      width: 180px;
      height: 90px;

      border-radius: 20px;
    }


    .skeleton-name {

      width:
        min(
          400px,
          70vw
        );

      height: 45px;
    }


    .skeleton-contact {

      width:
        min(
          500px,
          80vw
        );

      height: 65px;
    }


    @keyframes skeleton-loading {

      0% {
        left: -150%;
      }

      100% {
        left: 150%;
      }
    }


    /* =====================================================
       HELLO SCREEN
    ===================================================== */

    .hello-screen {

      position: fixed;

      inset: 0;

      z-index: 9998;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #f4f4f4;

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    .hello-screen.show {

      opacity: 1;

      visibility: visible;
    }


    .hello-text {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size:
        clamp(
          60px,
          16vw,
          150px
        );

      font-weight: 400;

      letter-spacing:
        -.045em;

      white-space: nowrap;

      color: #111;

      opacity: 0;

      transform:
        translateY(12px)
        scale(.98);

      filter:
        blur(4px);
    }


    .hello-screen.show .hello-text {

      animation:
        hello-appear
        .8s
        cubic-bezier(
          .16,
          1,
          .3,
          1
        )
        forwards;
    }


    @keyframes hello-appear {

      0% {

        opacity: 0;

        transform:
          translateY(12px)
          scale(.98);

        filter:
          blur(4px);
      }

      100% {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter:
          blur(0);
      }
    }


    .hello-screen.hide {

      animation:
        hello-exit
        .8s
        cubic-bezier(
          .4,
          0,
          1,
          1
        )
        forwards;
    }


    @keyframes hello-exit {

      from {
        opacity: 1;
      }

      to {

        opacity: 0;

        visibility: hidden;
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .website {

        padding:
          15px;
      }

      .container {

        width:
          min(
            100%,
            500px
          );
      }
    }


    /* =====================================================
       REDUCE MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          .01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          .01ms !important;
      }
    }

  </style>
</head>


<body>


  <!-- ===================================================
       SKELETON
  ==================================================== -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="skeleton">

      <div
        class="skeleton-box skeleton-title"
      ></div>

      <div
        class="skeleton-box skeleton-name"
      ></div>

      <div
        class="skeleton-box skeleton-contact"
      ></div>

    </div>

  </div>


  <!-- ===================================================
       HELLO
  ==================================================== -->

  <div
    class="hello-screen"
    id="helloScreen"
  >

    <div
      class="hello-text"
      id="helloText"
    ></div>

  </div>


  <!-- ===================================================
       WEBSITE
  ==================================================== -->

  <main
    class="website"
    id="website"
  >

    <div class="container">

      <section class="main">

        <h1>Hi!</h1>

        <h3>
          Saya, Syarief Rangga Nirwana
        </h3>

      </section>


      <section class="contact">

        <a
          href="mailto:syariefnirwana35@gmail.com"
          aria-label="Kirim email ke Syarief Rangga"
        >
          ✉ Gmail : syariefnirwana35@gmail.com
        </a>

      </section>

    </div>

  </main>


  <!-- ===================================================
       FULLSCREEN BALL
  ==================================================== -->

  <canvas
    id="footballCanvas"
  ></canvas>


  <script>

    /* =====================================================
       INTRO
    ===================================================== */

    const loadingScreen =
      document.getElementById(
        "loadingScreen"
      );

    const helloScreen =
      document.getElementById(
        "helloScreen"
      );

    const helloText =
      document.getElementById(
        "helloText"
      );

    const website =
      document.getElementById(
        "website"
      );


    const helloMessage =
      "Hello!";

    let helloIndex = 0;


    function typeHello() {

      if (
        helloIndex <
        helloMessage.length
      ) {

        helloText.textContent +=
          helloMessage[
            helloIndex
          ];

        helloIndex++;

        setTimeout(
          typeHello,
          180
        );
      }
    }


    window.addEventListener(
      "load",
      () => {

        setTimeout(
          () => {

            loadingScreen
              .classList
              .add("hide");


            setTimeout(
              () => {

                helloScreen
                  .classList
                  .add("show");


                setTimeout(
                  () => {

                    typeHello();

                  },
                  450
                );


                setTimeout(
                  () => {

                    helloScreen
                      .classList
                      .add("hide");


                    setTimeout(
                      () => {

                        website
                          .classList
                          .add("show");

                        initializeFootball();

                      },
                      700
                    );

                  },
                  3000
                );

              },
              700
            );

          },
          1200
        );

      }
    );


    /* =====================================================
       FULLSCREEN FOOTBALL PHYSICS
    ===================================================== */

    function initializeFootball() {

      const canvas =
        document.getElementById(
          "footballCanvas"
        );

      const ctx =
        canvas.getContext(
          "2d"
        );


      /* ===================================================
         VIEWPORT
      =================================================== */

      let width = 0;
      let height = 0;
      let dpr = 1;


      function resize() {

        width =
          window.innerWidth;

        height =
          window.innerHeight;


        dpr =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );


        canvas.width =
          width * dpr;

        canvas.height =
          height * dpr;


        canvas.style.width =
          width + "px";

        canvas.style.height =
          height + "px";


        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );


        if (
          ball.initialized
        ) {

          ball.x =
            Math.max(
              ball.radius,
              Math.min(
                width -
                ball.radius,
                ball.x
              )
            );


          ball.y =
            Math.max(
              ball.radius,
              Math.min(
                height -
                ball.radius,
                ball.y
              )
            );
        }
      }


      /* ===================================================
         BALL
      =================================================== */

      const ball = {

        initialized: false,

        x: 0,
        y: 0,

        vx: 0,
        vy: 0,

        radius:
          window.innerWidth < 500
            ? 27
            : 32,

        rotation: 0,

        angularVelocity: 0,

        squashX: 1,
        squashY: 1,

        targetSquashX: 1,
        targetSquashY: 1,

        dragging: false,

        pointerId: null,

        lastX: 0,
        lastY: 0,

        lastTime: 0,

        dragVX: 0,
        dragVY: 0
      };


      resize();

      window.addEventListener(
        "resize",
        resize
      );


      /* ===================================================
         START POSITION
      =================================================== */

      ball.x =
        width * .5;

      ball.y =
        height * .55;


      /*
        Kecepatan awal kecil.
      */

      ball.vx = 1.6;

      ball.vy = .8;

      ball.initialized = true;


      /* ===================================================
         IDLE SYSTEM
      =================================================== */

      let lastInteraction =
        performance.now();

      let idleMode = false;


      const IDLE_DELAY =
        15000;


      /*
        Kecepatan ketika bola
        berjalan sendiri.
      */

      const IDLE_SPEED =
        2.0;


      function resetIdleTimer() {

        lastInteraction =
          performance.now();

        idleMode = false;
      }


      function enterIdleMode() {

        idleMode = true;


        /*
          Pertahankan arah bola,
          tetapi normalkan kecepatannya.

          Jadi bola tidak tiba-tiba
          mengubah arah ketika masuk
          mode idle.
        */

        const speed =
          Math.sqrt(
            ball.vx * ball.vx +
            ball.vy * ball.vy
          );


        if (speed < .001) {

          /*
            Kalau bola benar-benar
            berhenti, berikan arah
            horizontal kecil.
          */

          ball.vx =
            IDLE_SPEED;

          ball.vy =
            IDLE_SPEED * .35;

        } else {

          ball.vx =
            ball.vx /
            speed *
            IDLE_SPEED;

          ball.vy =
            ball.vy /
            speed *
            IDLE_SPEED;
        }

      }


      /* ===================================================
         POINTER DOWN
      =================================================== */

      canvas.addEventListener(
        "pointerdown",
        (event) => {

          const rect =
            canvas.getBoundingClientRect();


          const px =
            event.clientX -
            rect.left;


          const py =
            event.clientY -
            rect.top;


          const dx =
            px -
            ball.x;


          const dy =
            py -
            ball.y;


          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          /*
            Area sedikit diperbesar
            agar bola mudah disentuh
            di HP.
          */

          if (
            distance >
            ball.radius * 1.5
          ) {

            return;
          }


          resetIdleTimer();


          ball.dragging =
            true;

          ball.pointerId =
            event.pointerId;


          ball.vx = 0;
          ball.vy = 0;


          ball.dragVX = 0;
          ball.dragVY = 0;


          ball.lastX = px;
          ball.lastY = py;


          ball.lastTime =
            performance.now();


          canvas.setPointerCapture(
            event.pointerId
          );

        }
      );


      /* ===================================================
         POINTER MOVE
      =================================================== */

      canvas.addEventListener(
        "pointermove",
        (event) => {

          if (
            !ball.dragging ||
            event.pointerId !==
            ball.pointerId
          ) {

            return;
          }


          resetIdleTimer();


          const rect =
            canvas.getBoundingClientRect();


          const px =
            event.clientX -
            rect.left;


          const py =
            event.clientY -
            rect.top;


          const now =
            performance.now();


          const dt =
            Math.max(
              now -
              ball.lastTime,
              1
            );


          const dx =
            px -
            ball.lastX;


          const dy =
            py -
            ball.lastY;


          /*
            Gerakkan bola mengikuti jari.
          */

          ball.x =
            Math.max(
              ball.radius,
              Math.min(
                width -
                ball.radius,
                px
              )
            );


          ball.y =
            Math.max(
              ball.radius,
              Math.min(
                height -
                ball.radius,
                py
              )
            );


          /*
            Hitung velocity swipe.
          */

          ball.dragVX =
            dx /
            dt *
            16;


          ball.dragVY =
            dy /
            dt *
            16;


          /*
            Spin mengikuti gerakan.
          */

          ball.angularVelocity =
            dx *
            .025;


          ball.rotation +=
            dx *
            .025;


          ball.lastX = px;
          ball.lastY = py;
          ball.lastTime = now;

        }
      );


      /* ===================================================
         RELEASE
      =================================================== */

      function releaseBall(
        event
      ) {

        if (
          !ball.dragging ||
          event.pointerId !==
          ball.pointerId
        ) {

          return;
        }


        ball.dragging =
          false;


        resetIdleTimer();


        /*
          Velocity mengikuti
          kekuatan swipe.
        */

        ball.vx =
          ball.dragVX *
          1.8;


        ball.vy =
          ball.dragVY *
          1.8;


        const maxVelocity =
          25;


        ball.vx =
          Math.max(
            -maxVelocity,
            Math.min(
              maxVelocity,
              ball.vx
            )
          );


        ball.vy =
          Math.max(
            -maxVelocity,
            Math.min(
              maxVelocity,
              ball.vy
            )
          );


        ball.angularVelocity =
          ball.vx *
          .025;
      }


      canvas.addEventListener(
        "pointerup",
        releaseBall
      );


      canvas.addEventListener(
        "pointercancel",
        releaseBall
      );


      /* ===================================================
         FOOTBALL DRAWING
      =================================================== */

      function drawFootball() {

        ctx.save();


        ctx.translate(
          ball.x,
          ball.y
        );


        /*
          =================================================
          SHADOW

          PENTING:

          Shadow TIDAK ikut rotation bola.

          Jadi shadow selalu berada
          di bawah bola.
          =================================================
        */

        ctx.save();


        /*
          Shadow sedikit lebih jauh
          ketika bola berada di atas.
        */

        const shadowOffset =
          ball.radius *
          .82;


        ctx.translate(
          0,
          shadowOffset
        );


        ctx.scale(
          1.0,
          .22
        );


        ctx.beginPath();


        ctx.ellipse(
          0,
          0,
          ball.radius *
            .82,

          ball.radius *
            .42,

          0,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "rgba(0,0,0,.18)";


        ctx.fill();


        ctx.restore();


        /*
          =================================================
          BOLA

          Rotation hanya diterapkan
          ke bola, BUKAN shadow.
          =================================================
        */

        ctx.rotate(
          ball.rotation
        );


        ctx.scale(
          ball.squashX,
          ball.squashY
        );


        /* =================================================
           BALL BODY
        ================================================= */

        const gradient =
          ctx.createRadialGradient(

            -ball.radius * .35,
            -ball.radius * .42,
            ball.radius * .08,

            0,
            0,
            ball.radius
          );


        gradient.addColorStop(
          0,
          "#ffffff"
        );


        gradient.addColorStop(
          .68,
          "#eeeeee"
        );


        gradient.addColorStop(
          1,
          "#bcbcbc"
        );


        ctx.beginPath();


        ctx.arc(
          0,
          0,
          ball.radius,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          gradient;


        ctx.fill();


        ctx.lineWidth =
          2.5;


        ctx.strokeStyle =
          "#111";


        ctx.stroke();


        /* =================================================
           CENTER PENTAGON
        ================================================= */

        drawPolygon(
          0,
          0,
          ball.radius * .27,
          5,
          -Math.PI / 2
        );


        ctx.fillStyle =
          "#111";


        ctx.fill();


        /* =================================================
           PANEL LINES
        ================================================= */

        const angles = [

          -Math.PI / 2,

          Math.PI / 10,

          Math.PI * .9,

          Math.PI * 1.45,

          Math.PI * 1.85

        ];


        angles.forEach(
          (angle) => {

            const px =
              Math.cos(angle) *
              ball.radius *
              .64;


            const py =
              Math.sin(angle) *
              ball.radius *
              .64;


            ctx.beginPath();


            ctx.moveTo(
              0,
              0
            );


            ctx.lineTo(
              px -
              Math.cos(
                angle - .5
              ) * 7,

              py -
              Math.sin(
                angle - .5
              ) * 7
            );


            ctx.lineTo(
              px +
              Math.cos(
                angle - .5
              ) * 7,

              py +
              Math.sin(
                angle - .5
              ) * 7
            );


            ctx.strokeStyle =
              "#111";


            ctx.lineWidth =
              1.8;


            ctx.stroke();

          }
        );


        /* =================================================
           HIGHLIGHT
        ================================================= */

        ctx.beginPath();


        ctx.arc(
          -ball.radius * .32,
          -ball.radius * .38,
          ball.radius * .12,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "rgba(255,255,255,.85)";


        ctx.fill();


        ctx.restore();

      }


      function drawPolygon(
        cx,
        cy,
        radius,
        sides,
        rotation
      ) {

        ctx.beginPath();


        for (
          let i = 0;
          i < sides;
          i++
        ) {

          const angle =
            rotation +
            i *
            Math.PI *
            2 /
            sides;


          const x =
            cx +
            Math.cos(angle) *
            radius;


          const y =
            cy +
            Math.sin(angle) *
            radius;


          if (i === 0) {

            ctx.moveTo(
              x,
              y
            );

          } else {

            ctx.lineTo(
              x,
              y
            );
          }
        }


        ctx.closePath();
      }


      /* ===================================================
         WALL COLLISION
      =================================================== */

      function hitWall(
        side,
        velocity
      ) {

        if (
          velocity <
          .7
        ) {

          return;
        }


        const strength =
          Math.min(
            velocity / 20,
            1
          );


        /*
          Dinding kiri/kanan:

          bola tertekan horizontal.
        */

        if (
          side === "left" ||
          side === "right"
        ) {

          ball.targetSquashX =
            1 -
            .23 *
            strength;


          ball.targetSquashY =
            1 +
            .14 *
            strength;
        }


        /*
          Dinding atas/bawah:

          bola tertekan vertikal.
        */

        if (
          side === "top" ||
          side === "bottom"
        ) {

          ball.targetSquashX =
            1 +
            .14 *
            strength;


          ball.targetSquashY =
            1 -
            .23 *
            strength;
        }


        /*
          Kembalikan bentuk normal.
        */

        setTimeout(
          () => {

            ball.targetSquashX = 1;
            ball.targetSquashY = 1;

          },
          70
        );

      }


      /* ===================================================
         PHYSICS LOOP
      =================================================== */

      let lastFrame =
        performance.now();


      function update(
        currentTime
      ) {

        const dt =
          Math.min(
            (
              currentTime -
              lastFrame
            ) / 16.6667,

            2
          );


        lastFrame =
          currentTime;


        /*
          ================================================
          IDLE CHECK
          ================================================
        */

        if (
          !ball.dragging &&
          !idleMode &&
          currentTime -
          lastInteraction >=
          IDLE_DELAY
        ) {

          enterIdleMode();
        }


        /*
          ================================================
          MOVEMENT

          TIDAK ADA GRAVITASI.
          ================================================
        */

        if (
          !ball.dragging
        ) {

          /*
            Ketika idle:

            speed harus konsisten.
          */

          if (
            idleMode
          ) {

            const speed =
              Math.sqrt(
                ball.vx *
                ball.vx +

                ball.vy *
                ball.vy
              );


            if (
              speed > .001
            ) {

              ball.vx =
                ball.vx /
                speed *
                IDLE_SPEED;


              ball.vy =
                ball.vy /
                speed *
                IDLE_SPEED;

            }

          }


          ball.x +=
            ball.vx *
            dt;


          ball.y +=
            ball.vy *
            dt;


          /*
            Rotation.
          */

          ball.rotation +=
            ball.angularVelocity *
            dt;


          ball.angularVelocity *=
            Math.pow(
              .985,
              dt
            );


          /*
            Sedikit air resistance
            ketika bukan idle.

            Idle TIDAK menggunakan
            friction supaya kecepatannya
            konsisten.
          */

          if (
            !idleMode
          ) {

            ball.vx *=
              Math.pow(
                .996,
                dt
              );


            ball.vy *=
              Math.pow(
                .996,
                dt
              );
          }


          /* =============================================
             LEFT
          ============================================= */

          if (
            ball.x -
            ball.radius <
            0
          ) {

            ball.x =
              ball.radius;


            ball.vx =
              Math.abs(
                ball.vx
              ) *
              .82;


            hitWall(
              "left",
              Math.abs(
                ball.vx
              )
            );
          }


          /* =============================================
             RIGHT
          ============================================= */

          if (
            ball.x +
            ball.radius >
            width
          ) {

            ball.x =
              width -
              ball.radius;


            ball.vx =
              -Math.abs(
                ball.vx
              ) *
              .82;


            hitWall(
              "right",
              Math.abs(
                ball.vx
              )
            );
          }


          /* =============================================
             TOP
          ============================================= */

          if (
            ball.y -
            ball.radius <
            0
          ) {

            ball.y =
              ball.radius;


            ball.vy =
              Math.abs(
                ball.vy
              ) *
              .82;


            hitWall(
              "top",
              Math.abs(
                ball.vy
              )
            );
          }


          /* =============================================
             BOTTOM
          ============================================= */

          if (
            ball.y +
            ball.radius >
            height
          ) {

            ball.y =
              height -
              ball.radius;


            ball.vy =
              -Math.abs(
                ball.vy
              ) *
              .82;


            hitWall(
              "bottom",
              Math.abs(
                ball.vy
              )
            );
          }
        }


        /* =================================================
           SQUASH SPRING
        ================================================= */

        ball.squashX +=
          (
            ball.targetSquashX -
            ball.squashX
          ) *
          .22 *
          dt;


        ball.squashY +=
          (
            ball.targetSquashY -
            ball.squashY
          ) *
          .22 *
          dt;


        ball.targetSquashX =
          1;


        ball.targetSquashY =
          1;


        /* =================================================
           RENDER
        ================================================= */

        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        drawFootball();


        requestAnimationFrame(
          update
        );
      }


      requestAnimationFrame(
        update
      );

    }

  </script>
