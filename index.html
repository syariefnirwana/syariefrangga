<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Syarief Rangga</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }
  body{position:fixed;inset:0;width:100%;height:100%;}

  /* ---------- SKELETON ---------- */
  #skeleton{
    position:fixed;inset:0;
    background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;z-index:30;
  }
  .sk-bar{background:#1c1c1c;border-radius:4px;overflow:hidden;position:relative;}
  .sk-bar.title{width:min(60vw,240px);height:34px;}
  .sk-bar.sub{width:min(70vw,280px);height:18px;}
  .sk-bar::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,#3a3a3a,transparent);
    animation:shimmer 1.3s infinite;
  }
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

  /* ---------- HELLO SCREEN ---------- */
  #hello-screen{
    position:fixed;inset:0;
    background:#fff;color:#000;
    display:none;align-items:center;justify-content:center;
    z-index:20;opacity:1;transition:opacity .6s ease;
  }
  #hello-text{
    font-weight:200;
    font-size:clamp(2.5rem,10vw,5rem);
    letter-spacing:-0.02em;
    margin:0;
    opacity:0;
    transform:scale(.85);
    animation:helloPop .5s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  @keyframes helloPop{
    to{opacity:1;transform:scale(1);}
  }
  #hello-text::after{
    content:"|";
    margin-left:4px;
    animation:blink 0.8s step-end infinite;
    font-weight:100;
  }

  @keyframes blink{50%{opacity:0;}}

  /* ---------- MAIN PAGE ---------- */
  @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap');

  #main{
    position:fixed;inset:0;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:28px;
    background:#efefef;
    background-image:radial-gradient(#cfcfcf 1px, transparent 1.4px);
    background-size:16px 16px;
    opacity:0;transition:opacity .6s ease;
    z-index:10;
    animation:bgDrift 22s linear infinite;
    overflow:hidden;
  }
  @keyframes bgDrift{
    from{background-position:0 0;}
    to{background-position:160px 160px;}
  }
  .card{
    background:#fff;
    border:3px solid #111;
    border-radius:38px 12px 34px 14px/16px 34px 12px 30px;
    box-shadow:8px 8px 0 #111;
    padding:clamp(26px,6vw,46px) clamp(30px,8vw,64px);
    max-width:min(86vw,480px);
    text-align:center;
    opacity:0;
    transform:translateY(28px) rotate(-1.4deg) scale(.94);
    animation:cardIn .7s cubic-bezier(.2,.85,.3,1.15) forwards, cardFloat 4.5s ease-in-out 1.1s infinite;
  }
  @keyframes cardIn{
    to{opacity:1;transform:translateY(0) rotate(-1.4deg) scale(1);}
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0) rotate(-1.4deg);}
    50%{transform:translateY(-6px) rotate(-1.4deg);}
  }
  .card h1{
    font-family:'Alfa Slab One',"Georgia",serif;
    font-size:clamp(3rem,12vw,5.4rem);
    line-height:1;
    margin:0 0 20px;
    color:#111;
  }
  .name-box{
    display:inline-block;
    background:#eee;
    border:2px solid #111;
    border-radius:12px;
    padding:8px 18px;
    opacity:0;
    transform:translateY(10px);
    animation:fadeUp .55s ease .55s forwards;
  }
  @keyframes fadeUp{
    to{opacity:1;transform:translateY(0);}
  }
  .name-box h3{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:clamp(.95rem,3.4vw,1.2rem);
    margin:0;
    color:#111;
  }
  .contact-pill{
    display:flex;align-items:center;gap:10px;
    background:#111;color:#fff;
    border-radius:999px;
    padding:14px 26px;
    max-width:min(86vw,440px);
    text-decoration:none;
    cursor:pointer;
    opacity:0;
    transform:translateY(18px) rotate(1deg) scale(.96);
    animation:pillIn .6s cubic-bezier(.2,.85,.3,1.15) .85s forwards, pillFloat 4.5s ease-in-out 1.9s infinite;
    transition:transform .15s ease;
  }
  @keyframes pillIn{
    to{opacity:1;transform:translateY(0) rotate(1deg) scale(1);}
  }
  @keyframes pillFloat{
    0%,100%{transform:translateY(0) rotate(1deg);}
    50%{transform:translateY(-5px) rotate(1deg);}
  }
  .contact-pill svg{flex:0 0 auto;width:18px;height:18px;}
  .contact-pill span{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:clamp(.8rem,2.8vw,1rem);
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .contact-pill:active{opacity:.75;transform:translateY(-5px) rotate(1deg) scale(.96);}

  /* ---------- BOLA HIDUP ---------- */
  #ball{
    position:absolute;
    top:0;left:0;
    width:clamp(52px,15vw,78px);
    height:clamp(52px,15vw,78px);
    touch-action:none;
    cursor:grab;
    z-index:16;
    will-change:transform;
  }
  #ball:active{cursor:grabbing;}
  .ball-spin{width:100%;height:100%;}
  .ball-body{
    position:relative;
    width:100%;height:100%;
    border-radius:50%;
    background:#fff;
    border:3px solid #111;
    box-shadow:4px 5px 0 #111;
    transition:transform .18s cubic-bezier(.3,1.6,.4,1);
  }
  .eyebrow{
    position:absolute;top:27%;width:16%;height:3px;background:#111;border-radius:2px;
    opacity:0;transition:opacity .2s ease, transform .2s ease;
  }
  .eyebrow.left{left:21%;transform-origin:right center;}
  .eyebrow.right{right:21%;transform-origin:left center;}
  .eye{
    position:absolute;top:38%;width:13%;height:13%;background:#111;border-radius:50%;
    animation:blinkEyes 5s ease-in-out infinite;
    transition:height .2s ease, top .2s ease, border-radius .2s ease;
  }
  .eye.left{left:25%;} .eye.right{right:25%;}
  @keyframes blinkEyes{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}
  .mouth{
    position:absolute;left:50%;top:58%;width:26%;height:9%;
    transform:translateX(-50%);
    border:3px solid transparent;border-bottom-color:#111;
    border-radius:0 0 55% 55%;
    background:transparent;
    transition:all .2s ease;
  }

  /* ekspresi: marah */
  .ball-body[data-expr="angry"] .eyebrow{opacity:1;}
  .ball-body[data-expr="angry"] .eyebrow.left{transform:rotate(22deg);}
  .ball-body[data-expr="angry"] .eyebrow.right{transform:rotate(-22deg);}
  .ball-body[data-expr="angry"] .eye{height:9%;top:41%;}
  .ball-body[data-expr="angry"] .mouth{width:20%;height:0;border-radius:0;top:63%;}

  /* ekspresi: sedih */
  .ball-body[data-expr="sad"] .eyebrow{opacity:1;}
  .ball-body[data-expr="sad"] .eyebrow.left{transform:rotate(-16deg) translateY(-2px);}
  .ball-body[data-expr="sad"] .eyebrow.right{transform:rotate(16deg) translateY(-2px);}
  .ball-body[data-expr="sad"] .mouth{
    border-bottom-color:transparent;border-top:3px solid #111;
    border-radius:55% 55% 0 0;top:64%;
  }

  /* ekspresi: tertawa */
  .ball-body[data-expr="laugh"] .eye{height:4%;top:40%;border-radius:50% 50% 0 0/100% 100% 0 0;}
  .ball-body[data-expr="laugh"] .mouth{
    width:36%;height:22%;border:3px solid #111;border-radius:50%;background:#111;top:52%;
  }

  /* ekspresi: malu */
  .ball-body[data-expr="shy"] .eye{height:5%;top:41%;}
  .ball-body[data-expr="shy"] .mouth{
    width:12%;height:12%;border:3px solid #111;border-radius:50%;background:transparent;top:58%;
  }

  /* ekspresi: takut (diangkat tinggi) */
  .ball-body[data-expr="fear"] .eyebrow{opacity:1;transform:translateY(-3px) !important;}
  .ball-body[data-expr="fear"] .eye{width:17%;height:17%;top:34%;}
  .ball-body[data-expr="fear"] .mouth{
    width:11%;height:11%;border:3px solid #111;border-radius:50%;background:transparent;top:60%;
  }
  .ball-body.trembling{animation:shake .12s linear infinite;}
  @keyframes shake{
    0%,100%{margin-left:calc(var(--shake,0px) * -1);}
    50%{margin-left:var(--shake,0px);}
  }

  /* ekspresi: kesakitan (kena sisi layar) */
  .ball-body[data-expr="pain"] .eyebrow{opacity:1;}
  .ball-body[data-expr="pain"] .eyebrow.left{transform:rotate(-12deg);}
  .ball-body[data-expr="pain"] .eyebrow.right{transform:rotate(12deg);}
  .ball-body[data-expr="pain"] .eye{height:3%;top:42%;}
  .ball-body[data-expr="pain"] .mouth{
    width:18%;height:14%;border:3px solid #111;border-radius:50%;background:#111;top:58%;
  }

  /* ekspresi: pusing */
  .ball-body[data-expr="dizzy"] .eye{background:transparent;}
  .ball-body[data-expr="dizzy"] .eye::before,
  .ball-body[data-expr="dizzy"] .eye::after{
    content:"";position:absolute;top:50%;left:50%;width:150%;height:2px;background:#111;
  }
  .ball-body[data-expr="dizzy"] .eye::before{transform:translate(-50%,-50%) rotate(45deg);}
  .ball-body[data-expr="dizzy"] .eye::after{transform:translate(-50%,-50%) rotate(-45deg);}
  .ball-body[data-expr="dizzy"] .mouth{
    width:16%;height:8%;border:3px solid #111;border-radius:50%;background:transparent;top:60%;
  }

  /* burung muter di atas kepala saat pusing */
  .birds{
    position:absolute;top:-16%;left:50%;width:0;height:0;
    opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .birds.show{opacity:1;animation:orbit 1s linear infinite;}
  .bird{position:absolute;top:0;font-size:13px;transform:translateY(-50%);}
  .bird.b1{left:20px;}
  .bird.b2{left:-20px;}
  @keyframes orbit{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  /* meletus & respawn */
  .boom{
    position:absolute;top:50%;left:50%;width:140%;height:140%;
    transform:translate(-50%,-50%) scale(.2);
    background:#111;opacity:0;pointer-events:none;
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  .boom.show{animation:boomPop .5s ease-out forwards;}
  @keyframes boomPop{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.2);}
    60%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.7);}
  }
  #ball.dead .ball-spin{opacity:0;}
</style>
</head>
<body>

  <div id="skeleton">
    <div class="sk-bar title"></div>
    <div class="sk-bar sub"></div>
  </div>

  <div id="hello-screen">
    <h1 id="hello-text"></h1>
  </div>

  <div id="main">
    <div class="card">
      <h1>Hi!</h1>
      <div class="name-box"><h3>Saya, Syarief Rangga Nirwana</h3></div>
    </div>
    <a class="contact-pill" href="mailto:syariefnirwana35@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      <span>Gmail : syariefnirwana35@gmail.com</span>
    </a>
    <div id="ball">
      <div class="ball-spin" id="ball-spin">
        <div class="ball-body" id="ball-body" data-expr="normal">
          <div class="eyebrow left"></div>
          <div class="eyebrow right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="birds" id="birds">
        <span class="bird b1">🐦</span>
        <span class="bird b2">🐦</span>
      </div>
      <div class="boom" id="boom"></div>
    </div>
  </div>

<script>
  // Cegah scroll ke segala arah
  ['wheel','touchmove','scroll'].forEach(function(evt){
    window.addEventListener(evt, function(e){ e.preventDefault(); }, {passive:false});
  });
  window.addEventListener('keydown', function(e){
    var keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End',' '];
    if (keys.indexOf(e.key) > -1) e.preventDefault();
  });
  // Cegah select text
  document.addEventListener('selectstart', function(e){ e.preventDefault(); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function typeHello(){
    var text = "Hello!";
    var el = document.getElementById('hello-text');
    var i = 0;
    var timer = setInterval(function(){
      el.textContent += text.charAt(i);
      i++;
      if(i >= text.length){
        clearInterval(timer);
        setTimeout(showMain, 1000);
      }
    }, 180);
  }

  function showMain(){
    var hello = document.getElementById('hello-screen');
    hello.style.opacity = '0';
    setTimeout(function(){
      hello.style.display = 'none';
      var main = document.getElementById('main');
      main.style.display = 'flex';
      requestAnimationFrame(function(){ main.style.opacity = '1'; });
    }, 600);
  }

  window.addEventListener('load', function(){
    document.getElementById('skeleton').style.display = 'none';
    var hello = document.getElementById('hello-screen');
    hello.style.display = 'flex';
    typeHello();
  });

  // ---------- FISIKA BOLA ----------
  (function(){
    var ball = document.getElementById('ball');
    var spin = document.getElementById('ball-spin');
    var body = document.getElementById('ball-body');
    var birds = document.getElementById('birds');
    var boom = document.getElementById('boom');
    var main = document.getElementById('main');
    var size = 60, x = 0, y = 0, vx = 0, vy = 0;
    var dragging = false, offX = 0, offY = 0;
    var history = [];
    var GRAVITY = 1900, RESTITUTION = 0.62, AIR_DRAG = 0.999, FLOOR_FRICTION = 0.9;
    var angle = 0, started = false;

    var IDLE_EXPRESSIONS = ['angry','sad','laugh','shy'];
    var IDLE_DELAY = 15000;
    var lastInteraction = performance.now();
    var idleActive = false, idleTimer = null, prevExprIdx = -1;

    var wasThrown = false, settledHandled = true;
    var painTimer = null, dizzyTimer = null;
    var dizzyCount = 0, DIZZY_LIMIT = 3, isDead = false;

    function bounds(){
      return { w: main.clientWidth, h: main.clientHeight };
    }

    function place(nx, ny){
      var b = bounds();
      size = ball.offsetWidth || size;
      x = Math.max(0, Math.min(nx, b.w - size));
      y = Math.max(0, Math.min(ny, b.h - size));
      render();
    }

    function render(){
      ball.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      spin.style.transform = 'rotate(' + angle + 'deg)';
    }

    function squash(sx, sy){
      body.style.transform = 'scale(' + sx + ',' + sy + ')';
      setTimeout(function(){ body.style.transform = 'scale(1,1)'; }, 160);
    }

    function pointerPos(e){
      var r = main.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function setExpression(name){
      body.setAttribute('data-expr', name);
    }

    function randomIdleExpression(){
      var idx;
      do { idx = Math.floor(Math.random() * IDLE_EXPRESSIONS.length); } while(idx === prevExprIdx && IDLE_EXPRESSIONS.length > 1);
      prevExprIdx = idx;
      setExpression(IDLE_EXPRESSIONS[idx]);
    }

    // idle: sebagian besar cuma menggelinding pindah tempat, sesekali melompat kecil
    function idleImpulse(){
      var hop = Math.random() < 0.25;
      vx = (Math.random() * 2 - 1) * (hop ? 190 : 130);
      if(hop){ vy = -(110 + Math.random() * 150); squash(0.85, 1.15); }
    }

    function scheduleIdleBeat(){
      var delay = 1000 + Math.random() * 1600;
      idleTimer = setTimeout(function(){
        if(!idleActive) return;
        randomIdleExpression();
        idleImpulse();
        scheduleIdleBeat();
      }, delay);
    }

    function startIdle(){
      idleActive = true;
      randomIdleExpression();
      idleImpulse();
      scheduleIdleBeat();
    }

    function stopIdle(){
      idleActive = false;
      setExpression('normal');
      if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    }

    function clearReactions(){
      if(painTimer){ clearTimeout(painTimer); painTimer = null; }
      if(dizzyTimer){ clearTimeout(dizzyTimer); dizzyTimer = null; }
      birds.classList.remove('show');
    }

    function triggerPain(){
      if(isDead) return;
      setExpression('pain');
      if(painTimer) clearTimeout(painTimer);
      painTimer = setTimeout(function(){ setExpression('normal'); }, 300);
    }

    function triggerDizzy(){
      if(isDead) return;
      setExpression('dizzy');
      birds.classList.add('show');
      dizzyCount++;
      if(dizzyTimer) clearTimeout(dizzyTimer);
      dizzyTimer = setTimeout(function(){
        birds.classList.remove('show');
        if(dizzyCount >= DIZZY_LIMIT){
          explode();
        } else {
          setExpression('normal');
          wasThrown = false;
        }
      }, 1600);
    }

    function explode(){
      isDead = true;
      wasThrown = false;
      boom.classList.add('show');
      ball.classList.add('dead');
      setTimeout(function(){ ball.style.visibility = 'hidden'; }, 260);
      setTimeout(respawn, 3000);
    }

    function respawn(){
      isDead = false;
      dizzyCount = 0;
      wasThrown = false; settledHandled = true;
      vx = 0; vy = 0; angle = 0;
      boom.classList.remove('show');
      ball.classList.remove('dead');
      ball.style.visibility = 'visible';
      setExpression('normal');
      var b = bounds();
      place(b.w * 0.62, b.h * 0.16);
    }

    main.addEventListener('pointerdown', function(){
      lastInteraction = performance.now();
      if(idleActive) stopIdle();
    });

    ball.addEventListener('pointerdown', function(e){
      if(isDead) return;
      lastInteraction = performance.now();
      if(idleActive) stopIdle();
      clearReactions();
      setExpression('normal');
      wasThrown = false; settledHandled = true;
      dragging = true; vx = 0; vy = 0;
      ball.setPointerCapture(e.pointerId);
      var p = pointerPos(e);
      offX = p.x - x; offY = p.y - y;
      history = [{ x: p.x, y: p.y, t: performance.now() }];
      squash(1.1, 0.9);
    });

    window.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var p = pointerPos(e);
      place(p.x - offX, p.y - offY);
      history.push({ x: p.x, y: p.y, t: performance.now() });
      if(history.length > 5) history.shift();

      // makin tinggi diangkat dari lantai, makin takut
      var b = bounds();
      var altitude = Math.max(0, (b.h - size) - y);
      var ratio = Math.min(1, altitude / (b.h * 0.55));
      if(ratio > 0.14){
        setExpression('fear');
        body.classList.add('trembling');
        body.style.setProperty('--shake', (ratio * 5).toFixed(1) + 'px');
      } else {
        body.classList.remove('trembling');
        setExpression('normal');
      }
    });

    window.addEventListener('pointerup', function(e){
      if(!dragging) return;
      dragging = false;
      lastInteraction = performance.now();
      body.classList.remove('trembling');
      setExpression('normal');
      if(history.length >= 2){
        var a = history[0], b = history[history.length - 1];
        var dt = Math.max(b.t - a.t, 1) / 1000;
        vx = (b.x - a.x) / dt;
        vy = (b.y - a.y) / dt;
      }
      var speed = Math.hypot(vx, vy);
      if(speed > 150){ wasThrown = true; settledHandled = false; }
      squash(1.12, 0.88);
    });

    var last = performance.now();
    function loop(now){
      var dt = Math.min((now - last) / 1000, 0.032);
      last = now;
      if(!dragging && !isDead){
        vy += GRAVITY * dt;
        vx *= AIR_DRAG;
        x += vx * dt;
        y += vy * dt;
        var b = bounds();
        if(x < 0){
          x = 0; vx = -vx * RESTITUTION; squash(0.8, 1.2);
          if(wasThrown && Math.abs(vx) > 150) triggerPain();
        } else if(x > b.w - size){
          x = b.w - size; vx = -vx * RESTITUTION; squash(0.8, 1.2);
          if(wasThrown && Math.abs(vx) > 150) triggerPain();
        }
        if(y < 0){
          y = 0; vy = -vy * RESTITUTION; squash(1.2, 0.8);
          if(wasThrown) triggerPain();
        } else if(y > b.h - size){
          y = b.h - size; vy = -vy * RESTITUTION; vx *= FLOOR_FRICTION;
          if(Math.abs(vy) > 60) squash(1.22, 0.8);
          if(Math.abs(vy) < 40) vy = 0;
        }
        angle += vx * dt * 0.6;
        render();

        var onFloor = y >= b.h - size - 0.5;
        var speedNow = Math.hypot(vx, vy);
        if(wasThrown && !settledHandled && onFloor && speedNow < 25){
          settledHandled = true;
          triggerDizzy();
        }

        if(!idleActive && !wasThrown && (now - lastInteraction) > IDLE_DELAY){
          startIdle();
        }
      }
      requestAnimationFrame(loop);
    }

    function start(){
      if(started) return;
      started = true;
      var b = bounds();
      size = ball.offsetWidth || size;
      place(b.w * 0.62, b.h * 0.16);
      lastInteraction = performance.now();
      requestAnimationFrame(loop);
    }

    var mo = new MutationObserver(function(){
      if(main.style.display === 'flex') start();
    });
    mo.observe(main, { attributes: true, attributeFilter: ['style'] });
    window.addEventListener('resize', function(){ if(started) place(x, y); });
  })();
</script>
</body>
