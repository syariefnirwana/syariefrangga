<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Syarief Rangga</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;

      -webkit-user-drag: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      overflow-x: hidden;

      background: #f4f4f4;
      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background-image:
        radial-gradient(#111 0.6px, transparent 0.6px);

      background-size: 7px 7px;
    }


    /* =====================================================
       LOADING SCREEN
    ===================================================== */

    .loading-screen {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f4f4;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    .loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* =====================================================
       SKELETON
    ===================================================== */

    .skeleton {
      width: min(700px, 85vw);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 25px;
    }

    .skeleton-box {
      position: relative;

      overflow: hidden;

      background: #ddd;

      border-radius: 10px;
    }

    .skeleton-box::after {
      content: "";

      position: absolute;

      top: 0;
      left: -150%;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.7),
          transparent
        );

      animation: skeleton-loading 1.4s infinite;
    }

    .skeleton-title {
      width: 180px;
      height: 90px;
      border-radius: 20px;
    }

    .skeleton-name {
      width: min(400px, 70vw);
      height: 45px;
    }

    .skeleton-contact {
      width: min(500px, 80vw);
      height: 65px;

      margin-top: 15px;
    }

    @keyframes skeleton-loading {

      0% {
        left: -150%;
      }

      100% {
        left: 150%;
      }

    }


    /* =====================================================
       HELLO SCREEN
    ===================================================== */

    .hello-screen {
      position: fixed;
      inset: 0;

      z-index: 9998;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f4f4;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;
    }

    .hello-screen.show {
      opacity: 1;
      visibility: visible;
    }


    /* =====================================================
       HELLO TEXT
    ===================================================== */

    .hello-text {

      /*
        Font system ala Apple.
        Di perangkat Apple akan menggunakan
        system font Apple jika tersedia.
      */

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size:
        clamp(60px, 16vw, 150px);

      font-weight: 400;

      letter-spacing: -0.045em;

      color: #111;

      white-space: nowrap;

      opacity: 0;

      transform:
        translateY(12px)
        scale(0.98);

      filter: blur(4px);
    }


    /* =====================================================
       HELLO APPEAR
    ===================================================== */

    .hello-screen.show .hello-text {

      animation:
        hello-appear
        0.8s
        cubic-bezier(0.16, 1, 0.3, 1)
        forwards;
    }

    @keyframes hello-appear {

      0% {
        opacity: 0;

        transform:
          translateY(12px)
          scale(0.98);

        filter: blur(4px);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);
      }

    }


    /* =====================================================
       HELLO EXIT
    ===================================================== */

    .hello-screen.hide {

      animation:
        hello-exit
        0.8s
        cubic-bezier(0.4, 0, 1, 1)
        forwards;
    }

    @keyframes hello-exit {

      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }

    }


    /* =====================================================
       MAIN WEBSITE
    ===================================================== */

    .website {

      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        clamp(20px, 5vw, 50px);

      opacity: 0;

      transform: translateY(20px);

      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    .website.show {

      opacity: 1;

      transform: translateY(0);
    }

    .container {

      width: 100%;

      max-width: 700px;

      margin: auto;
    }


    /* =====================================================
       MAIN CARD
    ===================================================== */

    .main {

      width: 100%;

      background: #fff;

      border:
        clamp(3px, 0.6vw, 5px)
        solid #111;

      border-radius:
        clamp(12px, 3vw, 18px);

      padding:
        clamp(35px, 8vw, 60px)
        clamp(20px, 6vw, 50px);

      text-align: center;

      box-shadow:
        clamp(5px, 1.5vw, 10px)
        clamp(5px, 1.5vw, 10px)
        0 #111;

      transform: rotate(-1deg);
    }


    /* =====================================================
       MAIN TITLE
    ===================================================== */

    .main h1 {

      font-family: Georgia, serif;

      font-size:
        clamp(70px, 18vw, 130px);

      line-height: 0.9;

      margin-bottom:
        clamp(20px, 5vw, 30px);

      text-shadow:
        3px 3px 0 #fff,
        6px 6px 0 #111;
    }


    /* =====================================================
       NAME
    ===================================================== */

    .main h3 {

      display: inline-block;

      max-width: 100%;

      padding: 10px 18px;

      background: #eee;

      border: 3px solid #111;

      border-radius: 10px;

      font-size:
        clamp(17px, 4vw, 24px);

      line-height: 1.3;

      font-weight: 700;

      transform: rotate(1deg);
    }


    /* =====================================================
       CONTACT
    ===================================================== */

    .contact {

      width: 100%;

      margin-top:
        clamp(30px, 7vw, 45px);

      background: #111;

      border: 4px solid #111;

      border-radius: 15px;

      box-shadow:
        clamp(4px, 1vw, 7px)
        clamp(4px, 1vw, 7px)
        0 #fff;

      transform: rotate(1deg);

      overflow: hidden;
    }

    .contact a {

      display: block;

      width: 100%;

      padding:
        clamp(18px, 5vw, 25px);

      color: #fff;

      text-decoration: none;

      font-size:
        clamp(15px, 4vw, 19px);

      font-weight: 700;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .contact a:hover {

      background: #fff;

      color: #111;
    }

    .contact a:active {

      transform: scale(0.97);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .website {
        padding: 20px 15px;
      }

      .main {
        padding: 40px 18px;
      }

      .main h3 {
        width: 100%;
      }

      .contact {
        margin-top: 30px;
      }

    }


    /* =====================================================
       REDUCE MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
      }

    }

  </style>
</head>


<body>


  <!-- ===================================================
       SKELETON
  ==================================================== -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="skeleton">

      <div class="skeleton-box skeleton-title"></div>

      <div class="skeleton-box skeleton-name"></div>

      <div class="skeleton-box skeleton-contact"></div>

    </div>

  </div>


  <!-- ===================================================
       HELLO
  ==================================================== -->

  <div
    class="hello-screen"
    id="helloScreen"
  >

    <div
      class="hello-text"
      id="helloText"
    ></div>

  </div>


  <!-- ===================================================
       WEBSITE
  ==================================================== -->

  <main
    class="website"
    id="website"
  >

    <div class="container">

      <section class="main">

        <h1>Hi!</h1>

        <h3>
          Saya, Syarief Rangga Nirwana
        </h3>

      </section>


      <section class="contact">

        <a
          href="mailto:syariefnirwana35@gmail.com"
          aria-label="Kirim email ke Syarief Rangga"
        >
          ✉ Gmail : syariefnirwana35@gmail.com
        </a>

      </section>

    </div>

  </main>


  <!-- ===================================================
       SCRIPT
  ==================================================== -->

  <script>

    const loadingScreen =
      document.getElementById("loadingScreen");

    const helloScreen =
      document.getElementById("helloScreen");

    const helloText =
      document.getElementById("helloText");

    const website =
      document.getElementById("website");


    /*
      ================================================
      HELLO TEXT ANIMATION
      ================================================

      Teks ditulis secara bertahap:

      H
      He
      Hel
      Hell
      Hello
      Hello!

    */

    const message = "Hello!";

    let index = 0;


    function typeHello() {

      if (index < message.length) {

        helloText.textContent +=
          message[index];

        index++;

        /*
          Jeda setiap karakter.
          Dibuat sedikit tidak terlalu cepat
          supaya terasa lebih natural.
        */

        setTimeout(
          typeHello,
          180
        );

      }

    }


    /*
      ================================================
      PAGE LOAD
      ================================================
    */

    window.addEventListener("load", () => {


      /*
        1. Skeleton tampil
      */

      setTimeout(() => {

        loadingScreen.classList.add("hide");


        /*
          2. Hello muncul
        */

        setTimeout(() => {

          helloScreen.classList.add("show");


          /*
            3. Mulai menulis Hello!
          */

          setTimeout(() => {

            typeHello();

          }, 450);


          /*
            4. Setelah Hello selesai,
               tunggu sebentar
          */

          setTimeout(() => {

            helloScreen.classList.add("hide");


            /*
              5. Website masuk
            */

            setTimeout(() => {

              website.classList.add("show");

            }, 700);

          }, 3000);

        }, 700);

      }, 1200);

    });

  </script>

</body>

</html>
