<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syarief Rangga Nirwana</title>
  
  <style>
    /* Mengimpor font Courier Prime untuk nuansa mesin tik / vintage */
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap');

    :root {
      --black: #111111;
      --white: #f5f5f5; /* Off-white seperti kertas tua */
      --border-thick: 4px;
    }

    /* Reset Dasar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      font-family: 'Courier Prime', monospace; /* Font monospace klasik */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Efek Kertas/Film Lama (Noise/Grain buatan) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        radial-gradient(var(--black) 1px, transparent 1px),
        radial-gradient(var(--black) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      opacity: 0.05;
      pointer-events: none; /* Agar tidak menghalangi klik */
      z-index: 100;
    }

    /* Kotak Utama ala Kartun Retro */
    .container {
      background-color: var(--white);
      border: var(--border-thick) solid var(--black);
      padding: 3rem 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      position: relative;
      /* Efek bayangan kasar / solid drop shadow */
      box-shadow: 12px 12px 0px 0px var(--black);
      /* Sedikit miring untuk kesan tidak kaku */
      transform: rotate(-1deg);
      transition: transform 0.2s ease-in-out;
    }

    .container:hover {
      transform: rotate(1deg);
    }

    .main h1 {
      font-size: 4rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -2px;
      line-height: 1;
      /* Garis bawah tebal */
      border-bottom: var(--border-thick) solid var(--black);
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    .main h3 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-top: 1.5rem;
      margin-bottom: 2rem;
    }

    .contact {
      border-top: 2px dashed var(--black);
      padding-top: 1.5rem;
    }

    .contact p {
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Gaya interaktif untuk link/teks email */
    .email-link {
      color: var(--white);
      background-color: var(--black);
      padding: 0.5rem 1rem;
      display: inline-block;
      margin-top: 0.5rem;
      text-decoration: none;
      border: 2px solid var(--black);
      transition: all 0.2s ease;
    }

    .email-link:hover {
      background-color: var(--white);
      color: var(--black);
      box-shadow: 4px 4px 0px 0px var(--black);
      transform: translate(-4px, -4px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="main">
      <h1>Hi!</h1>
      <h3>Saya, Syarief Rangga Nirwana.</h3>
    </div>
    
    <div class="contact">
      <p>Kirimkan Surat (Elektronik):</p>
      <a href="mailto:syariefnirwana35@gmail.com" class="email-link">
        syariefnirwana35@gmail.com
      </a>
    </div>
  </div>

</body>
</html>
